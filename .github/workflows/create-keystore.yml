name: Create Keystore

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate keystore
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ ${#KS_PASS} -lt 6 ]; then
            echo "::error::Add the KEYSTORE_PASSWORD secret first (6+ characters)"
            exit 1
          fi
          keytool -genkeypair -keystore upload.jks -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=App,O=Developer,C=US"
          base64 -w0 upload.jks > keystore_base64.txt
          {
            echo "## KEYSTORE_BASE64"
            echo "Copy the text below into a repo secret named KEYSTORE_BASE64:"
            echo '```'
            cat keystore_base64.txt
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: upload.jks
          retention-days: 1
